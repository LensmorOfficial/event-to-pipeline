name: Package Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install validation dependencies
        run: python3 -m pip install -r scripts/requirements.txt
      - name: Validate and test
        run: bash scripts/validate-repo.sh
      - name: Package source
        run: python3 scripts/package_release.py
      - name: Check version and prepare release notes
        id: version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          version = json.loads(Path('project.json').read_text())['version']
          if os.environ['GITHUB_REF_TYPE'] == 'tag' and os.environ['RELEASE_TAG'] != 'v' + version:
              raise SystemExit('The tag must match project.json.')
          notes = Path('docs/releases') / ('v' + version + '.md')
          if not notes.is_file():
              raise SystemExit('Versioned release notes are required.')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('version=' + version + '\n')
          PY
      - name: Retain source archive and checksums
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: event-to-pipeline-${{ steps.version.outputs.version }}
          path: dist/*
          if-no-files-found: error

  draft-release:
    if: github.ref_type == 'tag'
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install validation dependencies
        run: python3 -m pip install -r scripts/requirements.txt
      - name: Build source archive
        run: python3 scripts/package_release.py
      - name: Create draft preview release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" dist/* \
            --verify-tag --draft --prerelease \
            --title "Event-to-Pipeline $RELEASE_TAG" \
            --notes-file "docs/releases/$RELEASE_TAG.md"
